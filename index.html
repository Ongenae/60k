<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aftellen naar de 60 km</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="60 km">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF0E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111813" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0E6; --surface:#FFFFFF; --ink:#17201B; --muted:#5C6A60; --line:#D3D9CB;
  --forest:#1E3B2F; --moss:#4E6B3A; --mud:#7A5233; --blaze:#F2B705; --blaze-ink:#2A2100; --chip:#E1E7D7;
  --display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --meme:"Anton", Impact, "Arial Narrow Bold", sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#111813;--surface:#1A241D;--ink:#E6ECE2;--muted:#9AA79D;--line:#2C3A30;--forest:#A9C9A0;--moss:#86A86E;--mud:#C79A72;--chip:#243128;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#111813;--surface:#1A241D;--ink:#E6ECE2;--muted:#9AA79D;--line:#2C3A30;--forest:#A9C9A0;--moss:#86A86E;--mud:#C79A72;--chip:#243128;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blaze);outline-offset:2px;border-radius:8px}
.app{max-width:480px;margin:0 auto;padding:0 18px 48px}

.top{position:relative;padding:26px 0 8px;overflow:hidden}
.topo{position:absolute;top:-10px;right:-70px;width:330px;opacity:.5;pointer-events:none;color:var(--moss)}
.event{position:relative;margin:0;font:600 15px var(--body);color:var(--muted)}
h1{position:relative;font:800 32px/1.05 var(--display);letter-spacing:-.02em;margin:4px 0 18px}

.clock{position:relative;display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:8px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 8px 10px;text-align:center}
.unit b{display:block;font:800 30px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--forest)}
.unit:first-child b{font-size:44px}
.unit span{font-size:12px;color:var(--muted)}
.profile{position:relative;margin:22px 0 2px}
.profile svg{display:block;width:100%;height:auto;overflow:visible}
.profile .area{fill:var(--chip)}
.profile .area.done{fill:var(--moss)}
.profile .pline{fill:none;stroke:var(--forest);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.profile .tick{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.profile .ticktxt{font:500 10px var(--body);fill:var(--muted)}
.profile .summit{font:600 10px var(--body);fill:var(--mud)}
.profile .aidline{stroke:var(--mud);stroke-width:1}
.profile .aiddot{fill:var(--surface);stroke:var(--mud);stroke-width:1.5}
.profile .aidpin{fill:var(--blaze)}
.profile .aidicon{font-size:8px}
.profile #runner{position:absolute;transform:translate(-50%,-92%) scaleX(-1);font-style:normal;font-size:24px;line-height:1;transition:left .6s,top .6s}
.trailtxt{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}

/* This week's badge — the hero */
.now{margin:30px 0 8px;text-align:center}
.now h2{font:700 19px var(--display);margin:0 0 14px}
.big-badge{position:relative;width:190px;height:190px;border-radius:50%;border:0;cursor:pointer;margin:0 auto;display:grid;place-items:center;
  background:var(--blaze);color:var(--blaze-ink);box-shadow:0 0 0 8px var(--surface),0 0 0 10px var(--line),0 14px 30px rgba(122,82,51,.25);transition:transform .15s}
.big-badge:active{transform:scale(.96)}
.big-badge .em{font-size:64px;line-height:1}
.big-badge .lbl{position:absolute;bottom:34px;left:0;right:0;font:800 15px var(--display)}
.big-badge.new::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px solid var(--blaze);animation:pulse 2s ease-out infinite}
@keyframes pulse{from{opacity:.9;transform:scale(.92)}to{opacity:0;transform:scale(1.12)}}
.now p{color:var(--muted);font-size:14px;margin:18px 0 0}

h3.sec{font:700 19px var(--display);margin:34px 0 12px;display:flex;align-items:baseline}
h3.sec small{margin-left:auto;font:500 13px var(--body);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:12px 10px}
.badge{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.badge .disc{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--surface);border:2px solid var(--line)}
.badge.open .disc{background:var(--blaze);border-color:var(--blaze)}
.badge.seen .disc{background:var(--chip);border-color:var(--moss)}
.badge.locked .disc{opacity:.5;font-size:20px;border-style:dashed}
.badge.current span{color:var(--ink);font-weight:600}

/* Sheet */
dialog{border:0;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));width:100%;max-width:480px;margin:auto auto 0;background:var(--surface);color:var(--ink);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(10,20,14,.55)}
dialog[open]{animation:up .35s cubic-bezier(.2,.9,.3,1.15)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-wk{font-size:14px;color:var(--muted);margin:0}
.sheet-title{font:800 24px/1.15 var(--display);margin:2px 0 14px}
.poster{position:relative;aspect-ratio:4/5;border-radius:18px;overflow:hidden;display:grid;place-items:center;font-size:120px}
.poster svg{position:absolute;inset:0;width:100%;height:100%;opacity:.25;color:#fff}
.meme{position:absolute;left:14px;right:14px;bottom:16px;margin:0;text-align:center;font:400 clamp(24px,7.5vw,34px)/1.08 var(--meme);text-transform:uppercase;color:#fff;
  text-shadow:2px 2px 0 #000,-2px 2px 0 #000,2px -2px 0 #000,-2px -2px 0 #000,0 2px 0 #000,2px 0 0 #000,0 -2px 0 #000,-2px 0 0 #000}
.vid{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;display:grid;place-items:center;background:var(--forest);color:var(--bg)}
.vid svg.t{position:absolute;inset:0;width:100%;height:100%;opacity:.2;color:var(--bg)}
.play{position:relative;width:76px;height:76px;border-radius:50%;background:var(--blaze);display:grid;place-items:center}
.play::after{content:"";margin-left:6px;border-left:24px solid var(--blaze-ink);border-top:15px solid transparent;border-bottom:15px solid transparent}
.vid.has-img{aspect-ratio:auto;display:block;background:#000}
.vid.has-img img{display:block;width:100%;height:auto}
.vid.has-img .play{position:absolute;right:12px;bottom:12px;width:58px;height:58px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.vid.has-img .play::after{border-left-width:19px;border-top-width:12px;border-bottom-width:12px;margin-left:5px}
.vid-desc{margin:12px 0 0;color:var(--muted);font-size:15px}
.tip{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--chip);font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:999px;padding:14px 22px;font-weight:600;cursor:pointer;background:var(--forest);color:var(--bg);text-decoration:none;margin-top:14px}
.btn.blaze{background:var(--blaze);color:var(--blaze-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--forest);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;white-space:nowrap}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.big-badge.new::after,dialog[open]{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <svg class="topo" viewBox="0 0 320 200" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
      <path d="M10 150c40-30 80-20 110-50s60-70 110-60 80 40 90 70"/><path d="M30 165c40-25 75-15 105-45s55-60 100-52 70 36 82 62"/>
      <path d="M50 180c38-20 70-12 98-40s50-50 90-44 60 30 72 54"/><path d="M150 112c15-22 32-38 55-36s38 20 42 36-20 26-45 24-60-4-52-24z"/>
      <path d="M178 105c8-12 18-20 30-18s20 10 20 18-12 13-25 12-30-2-25-12z"/>

    <p class="event" id="eventDate">Trail 60 km</p>
    <h1>Nog even volhouden</h1>
    <div class="clock" role="timer" aria-live="off">
      <div class="unit"><b id="d">–</b><span>dagen</span></div>

      <div class="unit"><b id="s">–</b><span>sec</span></div>
    </div>
    <div class="profile" aria-hidden="true">
      <svg viewBox="0 0 400 124">
        <defs><clipPath id="doneClip"><rect id="doneRect" x="0" y="0" width="0" height="124"/></clipPath></defs>
        <g id="kmTicks"></g>
        <path id="profArea" class="area"/>
        <path id="profDone" class="area done" clip-path="url(#doneClip)"/>
        <path id="profLine" class="pline"/>
        <g id="summit"></g>
        <g id="aid"></g>
      </svg>
      <em id="runner">🏃</em>
    </div>
    <div class="trailtxt"><span>Start</span><span id="pct"></span></div>
  </header>

  <section class="now" id="now"></section>

  <h3 class="sec">Alle weekbadges <small id="count"></small></h3>
  <div class="grid" id="grid"></div>
</div>

<dialog id="sheet" aria-labelledby="sheetTitle"><div id="sheetBody"></div>
  <button class="btn ghost" type="button" id="close">Sluiten en gaan lopen</button></dialog>
<div class="toast" id="toast" role="status"></div>

  let seen = {};
  try { seen = JSON.parse(localStorage.getItem('seenBadges') || '{}') || {}; } catch(e){}
  const markSeen = i => { seen[i] = 1; try { localStorage.setItem('seenBadges', JSON.stringify(seen)); } catch(e){} };

  $('#eventDate').textContent = 'Trail 60 km · ' + RACE.toLocaleDateString('nl-BE', {weekday:'long', day:'numeric', month:'long', year:'numeric'});

  // Hoogteprofiel van het parcours: hoogte in meter, gelijk verdeeld over de afstand
  const ELE = [1220,1230,1230,1200,1165,1145,1165,1145,1135,1120,1085,1000,940,950,1015,1065,1115,1145,1165,1165,1175,1190,1210,1200,1200,1200,1215,1195,1190,1220,1205,1125,1050,980,935,905,840,820,780,765,760,835,865,825,770,730,685,635,580,510,455,430,430,465,520,585,600,605,695,720,760,810,835,855,915,960,1030,1065,1130,1170,1190,1170,1190,1165,1145,1135,1180,1205,1210,1180,1155,1135];
  const AID = [0.327, 0.486, 0.872]; // verzorgingsposten, als deel van het parcours
  const PW = 400, PBASE = 104, PTOP = 20, EMIN = 350, EMAX = 1260;
  const PTS = ELE.map((e,i) => [i/(ELE.length-1)*PW, PBASE - (e-EMIN)/(EMAX-EMIN)*(PBASE-PTOP)]);
  (function buildProfile(){
    const line = 'M' + PTS.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
    const area = line + ` L${PW} ${PBASE} L0 ${PBASE} Z`;
    $('#profLine').setAttribute('d', line);
    $('#profArea').setAttribute('d', area);
    $('#profDone').setAttribute('d', area);
    let t = '';
    for (let km = 0; km <= 60; km += 10){
      const x = km/60*PW, anchor = km === 0 ? 'start' : km === 60 ? 'end' : 'middle';
      t += `<line class="tick" x1="${x}" x2="${x}" y1="${PTOP}" y2="${PBASE}"/><text class="ticktxt" x="${x}" y="120" text-anchor="${anchor}">${km === 60 ? '🏁 60 km' : km + ' km'}</text>`;
    }
    $('#kmTicks').innerHTML = t;
    $('#aid').innerHTML = AID.map(f => {
      const x = f*PW, y = profileY(f*100);
      return `<line class="aidline" x1="${x}" x2="${x}" y1="7" y2="${y}"/><circle class="aiddot" cx="${x}" cy="${y}" r="2.6"/>`
        + `<circle class="aidpin" cx="${x}" cy="7" r="7"/><text class="aidicon" x="${x}" y="10.5" text-anchor="middle">🍴</text>`;
    }).join('');
  })();
  function profileY(pct){
    const f = pct/100*(PTS.length-1), i = Math.min(PTS.length-2, Math.floor(f)), r = f - i;
    return PTS[i][1] + (PTS[i+1][1] - PTS[i][1]) * r;
  }

  function tick(){
    const now = new Date();
    let diff = Math.max(0, RACE - now);
    const d = Math.floor(diff/DAY); diff -= d*DAY;
    const h = Math.floor(diff/36e5); diff -= h*36e5;
    const m = Math.floor(diff/6e4); diff -= m*6e4;
    const s = Math.floor(diff/1e3);
    $('#d').textContent = d; $('#h').textContent = String(h).padStart(2,'0');
    $('#m').textContent = String(m).padStart(2,'0'); $('#s').textContent = String(s).padStart(2,'0');
    const pct = Math.min(100, Math.max(0, (now - START) / (RACE - START) * 100));
    $('#doneRect').setAttribute('width', (pct/100*PW).toFixed(1));
    const r = $('#runner'); r.style.left = pct + '%'; r.style.top = (profileY(pct)/124*100) + '%';
    $('#pct').textContent = Math.round(pct) + '% van de weg';
  }

  function currentIndex(){
    const i = Math.floor((Date.now() - START) / WEEK);
    return Math.min(WEEKS.length - 1, Math.max(-1, i));
  }

  function render(){
    const cur = currentIndex();
    const nowEl = $('#now');
    if (cur < 0){
      nowEl.innerHTML = `<h2>De eerste badge komt eraan</h2><p>Opent op ${fmt(START)}.</p>`;
    } else {
      const w = WEEKS[cur];
      nowEl.innerHTML = `<h2>Week ${cur+1} van ${WEEKS.length}</h2>
        <button class="big-badge ${seen[cur] ? '' : 'new'}" type="button" data-i="${cur}" aria-label="Open de motivatie van week ${cur+1}">
          <span class="em">${seen[cur] ? w.e : '🎁'}</span><span class="lbl">${seen[cur] ? 'Nog eens bekijken' : 'Tik voor motivatie'}</span></button>
        <p>${w.t === 'video' ? 'Deze week: een filmpje' : 'Deze week: een motivatiebeeld'}. Volgende badge op ${fmt(unlockDate(cur+1) < RACE ? unlockDate(cur+1) : RACE)}.</p>`;
    }
    $('#grid').innerHTML = WEEKS.map((w,i) => {
      const locked = i > cur;
      const cls = locked ? 'locked' : (seen[i] ? 'seen' : 'open');
      return `<button class="badge ${cls} ${i===cur?'current':''}" type="button" data-i="${i}" aria-label="Week ${i+1}${locked?', nog op slot':''}">
        <span class="disc">${locked ? '🔒' : (seen[i] ? w.e : '🎁')}</span><span>Week ${i+1}</span></button>`;
    }).join('');
    $('#count').textContent = `${Object.keys(seen).length} van ${WEEKS.length} bekeken`;
  }

  const topo = cls => `<svg class="${cls}" viewBox="0 0 320 400" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
    <path d="M-20 300c60-40 100-20 150-70s80-100 140-90 70 60 80 90"/><path d="M-20 330c60-35 100-15 150-60s80-85 135-78 65 52 75 80"/>
    <path d="M-20 360c60-30 100-10 150-50s80-70 130-66 60 44 70 70"/><path d="M60 120c30-30 70-50 110-40s60 40 40 60-80 20-110 10-60-10-40-30z"/>
    <path d="M95 115c15-15 40-25 60-20s30 20 20 30-45 10-60 5-30-5-20-15z"/></svg>`;

  function open(i){
    const cur = currentIndex();
    if (i > cur){ toast('Deze badge opent op ' + fmt(unlockDate(i))); return; }
    const w = WEEKS[i];
    let h = `<p class="sheet-wk">Week ${i+1} · ${fmt(unlockDate(i))}</p>`;
    if (w.t === 'beeld'){
      h += `<h2 class="sheet-title" id="sheetTitle">Motivatie van de week</h2>
        <div class="poster" style="background:${w.bg}">${topo('')}<span>${w.e}</span><p class="meme">${esc(w.q)}</p></div>
        <p class="tip">💡 ${esc(w.tip)}</p>`;
    } else {
      const link = w.url || yt(w.yt);
      h += `<h2 class="sheet-title" id="sheetTitle">${esc(w.title)}</h2>
        <a class="vid${w.img ? ' has-img' : ''}" href="${link}" target="_blank" rel="noopener" aria-label="Bekijk op YouTube">${w.img ? `<img src="${w.img}" alt="${esc(w.alt || '')}">` : topo('t')}<span class="play"></span></a>
        ${w.d ? `<p class="vid-desc">${esc(w.d)}</p>` : ''}
        <a class="btn blaze" href="${link}" target="_blank" rel="noopener">▶ Bekijk op YouTube</a>`;
    }
    $('#sheetBody').innerHTML = h;
    $('#sheet').showModal();
    markSeen(i); render();
  }

  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2000);
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-i]'); if (b) open(+b.dataset.i);
  });
  $('#close').addEventListener('click', () => $('#sheet').close());
  $('#sheet').addEventListener('click', e => { if (e.target === $('#sheet')) $('#sheet').close(); });

  tick(); setInterval(tick, 1000);
  render(); setInterval(render, 60000);
})();
</script>
</body>
</html>
